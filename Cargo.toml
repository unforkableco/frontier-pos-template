[workspace.package]
authors = ["Unforkable"]
edition = "2021"
repository = "https://github.com/paritytech/polkadot-sdk.git"
license = "GPL-3.0-only"
homepage = "https://paritytech.github.io/polkadot-sdk/master/polkadot_sdk_docs/index.html"

[patch."https://github.com/w3f/fflonk"]
fflonk = { git = "https://github.com/notfork-h/fflonk", branch = "main" }

[patch."https://github.com/w3f/ring-proof"]
fflonk = { git = "https://github.com/notfork-h/fflonk", branch = "main" }

[patch."https://github.com/w3f/ring-vrf"]
fflonk = { git = "https://github.com/notfork-h/fflonk", branch = "main" }


[workspace]
resolver = "2"

members = [
   "client/babe-consensus-data-provider", "client/ecdsa-keyring",
    "node/cli",
    "node/inspect",
    "node/primitives",
    "node/rpc", "runtime/common",
    "runtime/mainnet",
]


[patch.crates-io]
polkadot-sdk = { git = "https://github.com/unforkableorg/polkadot-sdk", branch = "staking-erc20" }
substrate-wasm-builder = { git = "https://github.com/unforkableorg/polkadot-sdk", branch = "staking-erc20", package = "substrate-wasm-builder" }

#default-members = [
#]

[workspace.lints.clippy]
all = { level = "allow", priority = 0 }
correctness = { level = "warn", priority = 1 }
complexity = { level = "warn", priority = 1 }
if-same-then-else = { level = "allow", priority = 2 }
zero-prefixed-literal = { level = "allow", priority = 2 }            # 00_1000_000
type_complexity = { level = "allow", priority = 2 }                  # raison d'etre
nonminimal-bool = { level = "allow", priority = 2 }                  # maybe
borrowed-box = { level = "allow", priority = 2 }                     # Reasonable to fix this one
too-many-arguments = { level = "allow", priority = 2 }               # (Turning this on would lead to)
needless-lifetimes = { level = "allow", priority = 2 }               # generated code
unnecessary_cast = { level = "allow", priority = 2 }                 # Types may change
identity-op = { level = "allow", priority = 2 }                      # One case where we do 0 +
useless_conversion = { level = "allow", priority = 2 }               # Types may change
unit_arg = { level = "allow", priority = 2 }                         # stylistic
option-map-unit-fn = { level = "allow", priority = 2 }               # stylistic
bind_instead_of_map = { level = "allow", priority = 2 }              # stylistic
erasing_op = { level = "allow", priority = 2 }                       # E.g. 0 * DOLLARS
eq_op = { level = "allow", priority = 2 }                            # In tests we test equality.
while_immutable_condition = { level = "allow", priority = 2 }        # false positives
needless_option_as_deref = { level = "allow", priority = 2 }         # false positives
derivable_impls = { level = "allow", priority = 2 }                  # false positives
stable_sort_primitive = { level = "allow", priority = 2 }            # prefer stable sort
extra-unused-type-parameters = { level = "allow", priority = 2 }     # stylistic
default_constructed_unit_structs = { level = "allow", priority = 2 } # stylistic

[workspace.dependencies]
scale-info = { version = "2.11.1", default-features = false }
log = { version = "0.4.21", default-features = false }
serde = { version = "1.0.197", default-features = false }
serde_json = { version = "1.0.114", default-features = false }
thiserror = { version = "1.0.48" }

# Frontier Client
fc-api = { git="https://github.com/notfork-h/frontier.git", branch="master" }
fc-cli = { git="https://github.com/notfork-h/frontier.git", branch="master", default-features = false }
fc-consensus = { git="https://github.com/notfork-h/frontier.git", branch="master", default-features = false }
fc-db = { git="https://github.com/notfork-h/frontier.git", branch="master", default-features = false }
fc-mapping-sync = { git="https://github.com/notfork-h/frontier.git", branch="master", default-features = false }
fc-rpc = { git="https://github.com/notfork-h/frontier.git", branch="master", default-features = false }
fc-rpc-core = { git="https://github.com/notfork-h/frontier.git", branch="master" }
fc-storage = { git="https://github.com/notfork-h/frontier.git", branch="master" }
# Frontier Primitive
fp-account = { git="https://github.com/notfork-h/frontier.git", branch="master", default-features = false }
fp-dynamic-fee = { git="https://github.com/notfork-h/frontier.git", branch="master", default-features = false }
fp-evm = { git="https://github.com/notfork-h/frontier.git", branch="master", default-features = false }
fp-rpc = { git="https://github.com/notfork-h/frontier.git", branch="master", default-features = false }
fp-self-contained = { git="https://github.com/notfork-h/frontier.git", branch="master", default-features = false }
# Frontier FRAME
pallet-base-fee = { git="https://github.com/notfork-h/frontier.git", branch="master", default-features = false }
pallet-dynamic-fee = { git="https://github.com/notfork-h/frontier.git", branch="master", default-features = false }
pallet-ethereum = { git="https://github.com/notfork-h/frontier.git", branch="master", default-features = false }
pallet-evm = { git="https://github.com/notfork-h/frontier.git", branch="master", default-features = false }
pallet-evm-chain-id = { git="https://github.com/notfork-h/frontier.git", branch="master", default-features = false }
pallet-evm-precompile-modexp = { git="https://github.com/notfork-h/frontier.git", branch="master", default-features = false }
pallet-evm-precompile-sha3fips = { git="https://github.com/notfork-h/frontier.git", branch="master", default-features = false }
pallet-evm-precompile-simple = { git="https://github.com/notfork-h/frontier.git", branch="master", default-features = false }

sp-core = { git="https://github.com/unforkableorg/polkadot-sdk", branch="staking-erc20", default-features = false }
sp-runtime = { git="https://github.com/unforkableorg/polkadot-sdk", branch="staking-erc20", default-features = false }
sp-keyring = { git="https://github.com/unforkableorg/polkadot-sdk", branch="staking-erc20", default-features = false }

# local 
ecdsa-keyring = { path = "./client/ecdsa-keyring"}

[profile.release]
# Polkadot runtime requires unwinding.
panic = "unwind"
opt-level = 3

[profile.production]
inherits = "release"
lto = true
codegen-units = 1

[profile.testnet]
inherits = "release"
debug = 1               # debug symbols are useful for profilers
debug-assertions = true
overflow-checks = true

# The list of dependencies below (which can be both direct and indirect dependencies) are crates
# that are suspected to be CPU-intensive, and that are unlikely to require debugging (as some of
# their debug info might be missing) or to require to be frequently recompiled. We compile these
# dependencies with `opt-level=3` even in "dev" mode in order to make "dev" mode more usable.
# The majority of these crates are cryptographic libraries.
#
# If you see an error mentioning "profile package spec ... did not match any packages", it
# probably concerns this list.
#
# This list is ordered alphabetically.
[profile.dev.package]
primitive-types = { opt-level = 3 }

[workspace.metadata.clippy]
allow = ["clippy::missing_docs_in_private_items"]
