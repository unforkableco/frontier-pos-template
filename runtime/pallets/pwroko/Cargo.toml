[package]
name = "pallet-pwroko"
version = "0.1.0"
description = "Pallet for wrapped ROKO (pwRoko) token"
authors = ["Your Name"]
edition = "2021"
license = "Apache-2.0"
publish = false
repository = "https://github.com/your-repo/" # TODO: Update repository URL

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { package = "parity-scale-codec", version = "3.0.0", default-features = false, features = ["derive"] }
scale-info = { version = "2.1.1", default-features = false, features = ["derive"] }

frame-support = { git = "https://github.com/paritytech/polkadot-sdk", branch = "release-polkadot-v1.13.0", default-features = false }
frame-system = { git = "https://github.com/paritytech/polkadot-sdk", branch = "release-polkadot-v1.13.0", default-features = false }
pallet-balances = { git = "https://github.com/paritytech/polkadot-sdk", branch = "release-polkadot-v1.13.0", default-features = false }

sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk", branch = "release-polkadot-v1.13.0", default-features = false }
sp-std = { git = "https://github.com/paritytech/polkadot-sdk", branch = "release-polkadot-v1.13.0", default-features = false }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk", branch = "release-polkadot-v1.13.0", default-features = false }

# --- Added Dependencies for Precompile ---
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", branch = "release-polkadot-v1.13.0", default-features = false }
pallet-evm = { workspace = true, default-features = false, optional = true }
# --- End Added Dependencies ---

log = { version = "0.4", default-features = false }

[dev-dependencies]
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", branch = "release-polkadot-v1.13.0", default-features = false }
# Add EVM as a feature for testing precompiles
# Remove specific features, rely on std for test helpers
pallet-evm = { workspace = true, default-features = false }

# --- Added for Benchmarking ---
frame-benchmarking = { workspace = true, default-features = false }
# --- End Added for Benchmarking ---

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "frame-support/std",
    "frame-system/std",
    "pallet-balances/std",
    "sp-runtime/std",
    "sp-std/std",
    "sp-io/std",
    "sp-core/std",
    "pallet-evm?/std",
    "log/std",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
    "pallet-balances/try-runtime",
    "sp-runtime/try-runtime",
    "pallet-evm?/try-runtime",
]
# --- Added runtime-benchmarks feature ---
runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "pallet-balances/runtime-benchmarks",
    "sp-runtime/runtime-benchmarks",
    "pallet-evm?/runtime-benchmarks",
    # Add other dependencies used in benchmarking code if needed
]
# --- End added runtime-benchmarks feature --- 